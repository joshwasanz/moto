<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your cart — Motor Re Cycle</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,800&family=Inter:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="assets/style.css">
<script src="assets/app.js"></script>
</head>
<body>
<main class="page">
  <div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px">
    <h1 class="display page-title">Your cart</h1>
    <a href="catalog.html" style="font-weight:700">Continue shopping ›</a>
  </div>
  <div id="cart"></div>
</main>
<script>
layout();
function draw() {
  const items = Cart.get();
  if (!items.length) {
    $('#cart').innerHTML = '<div class="empty" style="margin-top:28px"><p style="font-size:24px;font-weight:800;margin:0 0 16px">Your cart is empty</p><a class="btn ember" href="catalog.html">Continue shopping</a></div>';
    return;
  }
  const total = items.reduce((n, i) => n + i.price * i.qty, 0);
  $('#cart').innerHTML = `<div class="cart"><div class="lines">${items.map((i, k) => `<div class="line">
  <a href="product.html?p=${i.handle}"><img src="${imgUrl(i.img, 300)}" alt="${esc(i.title)}"></a>
  <div style="min-width:0"><a class="name" href="product.html?p=${i.handle}">${esc(i.title)}</a>
    <div class="muted" style="font-size:14px">${i.variant ? esc(i.variant) + ' · ' : ''}${money(i.price)} each</div>
    <div class="ctl"><div class="qty"><button data-k="${k}" data-q="-1" aria-label="Decrease quantity">−</button><span>${i.qty}</span><button data-k="${k}" data-q="1" aria-label="Increase quantity">+</button></div>
    <button class="link-btn" data-k="${k}" data-q="0">Remove</button></div></div>
  <div class="total">${money(i.price * i.qty)}</div></div>`).join('')}</div>
<aside class="summary" aria-label="Order summary">
  <div class="row-sum"><span style="font-weight:700;color:var(--soft)">Estimated total</span><span style="font-size:30px;font-weight:800">${money(total)}</span></div>
  <p class="muted" style="margin:0;font-size:13px">Taxes, discounts and shipping calculated at checkout.</p>
  <a class="btn ember" href="${Cart.checkoutUrl(items)}">Check out</a>
  <p class="muted" style="margin:0;font-size:13px;text-align:center">You'll finish checkout on our official Shopify store,<br><b style="color:var(--soft)">${CONFIG.store.replace('https://', '')}</b>. We never ask for card details on this site.</p>
</aside></div>`;
}
$('#cart').onclick = e => {
  const b = e.target.closest('[data-k]'); if (!b) return;
  const items = Cart.get(), i = items[+b.dataset.k], q = +b.dataset.q;
  q === 0 ? items.splice(+b.dataset.k, 1) : (i.qty = Math.max(1, i.qty + q));
  Cart.save(items); draw();
};
draw();
</script>
</body>
</html>
