<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Product — Motor Re Cycle</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,800&family=Inter:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="assets/style.css">
<script src="assets/app.js"></script>
</head>
<body>
<main>
  <div class="page" id="product" style="padding-bottom:48px"><p class="loading" style="padding:0">Loading…</p></div>
  <div id="more" style="padding-bottom:64px"></div>
</main>
<script>
layout('Catalog');
loadProducts().then(list => {
  const p = list.find(x => x.handle === param('p'));
  if (!p) { $('#product').innerHTML = '<h1 class="display page-title">Part not found</h1><p><a href="catalog.html">Browse all parts ›</a></p>'; return; }
  document.title = p.title + ' — Motor Re Cycle';
  const sel = (p.variants.find(v => v.available) || p.variants[0]).options.slice();
  let img = 0, qty = 1;
  const variant = () => p.variants.find(v => v.options.every((o, i) => o === sel[i])) || p.variants[0];

  function draw() {
    const v = variant(), avail = v.available;
    $('#product').innerHTML = `<nav class="crumbs" aria-label="Breadcrumb"><a href="index.html">Home</a> › <a href="catalog.html?cat=${encodeURIComponent(p.cat)}">${esc(p.cat)}</a> › ${esc(p.title)}</nav>
<div class="pdp">
  <div class="gallery">
    <div class="main"><img src="${imgUrl(p.images[img], 1200)}" alt="${esc(p.title)}"></div>
    ${p.images.length > 1 ? `<div class="thumbs">${p.images.map((s, i) => `<button aria-label="Photo ${i + 1}" aria-pressed="${i === img}" data-img="${i}"><img src="${imgUrl(s, 200)}" alt=""></button>`).join('')}</div>` : ''}
  </div>
  <div class="buy">
    <div style="display:flex;flex-direction:column;gap:14px">
      <p class="eyebrow">${esc(p.cat)}</p>
      <h1 class="display">${esc(p.title)}</h1>
      <div class="meta"><span class="price">${money(v.price)}</span><span class="chip ${avail ? 'in' : ''}">${avail ? 'In stock' : 'Sold out'}</span><span class="muted" style="font-size:14px">Shipping calculated at checkout.</span></div>
    </div>
    ${p.options.map(o => { const i = o.i; return `<fieldset class="opts"><legend>${esc(o.name)}: <span class="muted">${esc(sel[i])}</span></legend><div>
      ${o.values.map(val => `<button class="opt" data-opt="${i}" data-val="${esc(val)}" aria-pressed="${val === sel[i]}"${p.variants.some(v => v.options[i] === val && v.available) ? '' : ' data-off title="Sold out"'}>${esc(val)}</button>`).join('')}</div></fieldset>`; }).join('')}
    <div style="display:flex;flex-direction:column;gap:10px"><span style="font-weight:700">Quantity</span>
      <div class="qty"><button data-q="-1" aria-label="Decrease quantity">−</button><span aria-live="polite">${qty}</span><button data-q="1" aria-label="Increase quantity">+</button></div></div>
    <div class="actions">
      <button class="btn ember" id="add" ${avail ? '' : 'disabled'}>${avail ? 'Add to cart' : 'Sold out'}</button>
      <a class="btn white" ${avail ? `href="${Cart.checkoutUrl([{ id: v.id, qty }])}"` : 'aria-disabled="true" style="opacity:.4;pointer-events:none"'}>Buy it now</a>
    </div>
    ${waNumber ? `<a class="btn outline" target="_blank" rel="noopener" href="https://wa.me/${waNumber}?text=${encodeURIComponent('Hi, I have a question about: ' + p.title + ' ' + location.href)}">Ask about this part on WhatsApp</a>` : ''}
    ${p.desc ? `<div class="desc"><h2>Details</h2>${esc(p.desc)}</div>` : ''}
  </div>
</div>`;
  }
  draw();

  $('#product').onclick = e => {
    const t = e.target.closest('button'); if (!t) return;
    if (t.dataset.img) img = +t.dataset.img;
    else if (t.dataset.opt) sel[+t.dataset.opt] = t.dataset.val;
    else if (t.dataset.q) qty = Math.max(1, qty + +t.dataset.q);
    else if (t.id === 'add') {
      const v = variant();
      Cart.add({ id: v.id, qty, handle: p.handle, title: p.title, variant: p.options.length ? v.title : '', price: v.price, img: p.images[0] });
      toast(`Added to cart <a href="cart.html">View cart ›</a>`); return;
    } else return;
    draw();
  };

  $('#more').innerHTML = row('More ' + p.cat, list.filter(x => x.cat === p.cat && x.handle !== p.handle), 'catalog.html?cat=' + encodeURIComponent(p.cat));
}).catch(() => loadError($('#product')));
</script>
</body>
</html>
